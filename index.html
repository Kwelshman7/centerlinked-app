    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CenterLinked",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What if a listing is out of date?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Every facility carries the date someone last confirmed it. Fresh means within 30 days. Recent means 31 to 60 days. After that the listing is marked as needing confirmation, and a facility that stays unconfirmed is frozen and leaves search until someone verifies it again. A quiet listing shows up as absent rather than as current."
            }
          },
          {
            "@type": "Question",
            "name": "Does it show whether a bed is open today?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No, and it does not try to. Census changes by the hour and no directory can keep up with it honestly. CenterLinked answers the question that comes before the bed: which programs hold a contract with this payer, at this level of care, in this city, and who to call to confirm. You still confirm the bed and the benefit on the phone."
            }
          },
          {
            "@type": "Question",
            "name": "Will this replace the relationships I already have?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. It is a lookup and a contact list, not a broker. There are no mass messages and no lead routing — you decide who to call, and the call is still yours. Contacts keeps the people you already work with in one place, so the next referral for the same payer does not start from a spreadsheet. The product is for the programs you have not met yet."
            }
          },
          {
            "@type": "Question",
            "name": "Is this a directory for patients or families?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Accounts require a work email, and personal email domains stay blocked unless they have been approved. It is not a consumer treatment directory, it does not store charts or schedule care, and no protected health information belongs on a listing."
            }
          },
          {
            "@type": "Question",
            "name": "Do the insurance listings mean a plan is verified?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. In-network contracts on a listing tell you which programs are worth a call. They are not an eligibility check for a specific member. Benefits verification stays in your normal admissions process."
            }
          },
          {
            "@type": "Question",
            "name": "What does it cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Searching is free with a work email, and no card is required. Listing an organization is free too. Membership is optional and priced by how many facilities you keep live, starting at $99 a month for one facility."
            }
          }
        ]
      }
    </script>
